<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="/dashboard">💰 Expense Tracker</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            {% if session.user_name %}
                <span class="text-white small">👤 {{ session.user_name }}</span>
                <a class="nav-link text-white" href="/dashboard">Dashboard</a>
                <a class="nav-link text-white" href="/add">Add Expense</a>
                <a class="nav-link text-white" href="/report">Report</a>
                <a class="btn btn-outline-light btn-sm" href="/logout">Logout</a>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
