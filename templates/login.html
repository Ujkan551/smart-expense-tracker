{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm text-center">

            <h1 class="fw-bold mb-1">💰 Expense Tracker</h1>
            <p class="text-muted mb-4">Login or create a new account</p>

            {% if error %}
            <div class="alert alert-danger fw-bold">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/">
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold">Your Name</label>
                    <input type="text" name="name" class="form-control form-control-lg"
                           placeholder="e.g. Ujjwal" required autofocus>
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg"
                           placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold fs-5">
                    Login / Register →
                </button>
            </form>

            <p class="text-muted mt-3 small">
                New user? Just enter a new name and password — account will be created automatically!
            </p>

        </div>
    </div>
</div>

{% endblock %}
